name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinetix
          POSTGRES_PASSWORD: kinetix
          POSTGRES_DB: kinetix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kinetix" --health-interval 3s --health-retries 20
    env:
      KINETIX_TEST_DATABASE_URL: postgresql+psycopg://kinetix:kinetix@localhost:5432/kinetix_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Install Semgrep for rule-pack tests
        run: uv tool install semgrep==1.179.0
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
