name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinetix
          POSTGRES_PASSWORD: kinetix
          POSTGRES_DB: kinetix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kinetix" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      KINETIX_TEST_DATABASE_URL: postgresql+psycopg://kinetix:kinetix@localhost:5432/kinetix_test
      KINETIX_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Install Semgrep for rule-pack tests
        run: uv tool install semgrep==1.179.0
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The whole stack, built from the Dockerfiles and started with Compose, tested through the
  # public edge only, with live GitHub, OSV and security.txt lookups.
  # Runs on Intel/AMD and on ARM (Apple Silicon Macs and Oracle Ampere run ARM containers).
  stack:
    needs: [api, web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the edge
        run: |
          for i in $(seq 1 120); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 5
          done
          exit 1
      - name: Smoke test through the edge
        run: python3 scripts/smoke.py http://localhost:3000 --api-direct http://localhost:8000
      - name: Worker sandbox holds
        run: |
          if docker compose exec -T worker sh -c 'touch /app/pwned' 2>/dev/null; then
            echo "worker root filesystem is writable"; exit 1
          fi
          test "$(docker compose exec -T worker id -u)" = 10001
          test "$(docker compose exec -T worker sh -c 'grep CapEff /proc/self/status' | awk '{print $2}')" = 0000000000000000
      - name: Production configuration renders
        run: |
          sh scripts/setup-env.sh kinetix.example.com
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          rm .env
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 300

  # The one-command installer, end to end with real Docker: settings, build, health, no
  # published ports, and a rerun that keeps settings. (The tunnel token is fake, so the
  # tunnel itself can't connect here.)
  quickstart:
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KINETIX_HOME: ${{ runner.temp }}/kinetix
      KINETIX_SRC: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install with the quickstart script
        run: |
          KINETIX_DOMAIN=kinetix.example.com \
          CLOUDFLARE_TUNNEL_TOKEN=eyJhIjoiZmFrZSIsInQiOiJmYWtlIiwicyI6ImZha2UifQ== \
          sh scripts/quickstart.sh < /dev/null
      - name: Settings are private and production-grade
        run: |
          test "$(stat -c %a "$KINETIX_HOME/.env")" = 600
          grep -q '^KINETIX_APP_URL=https://kinetix.example.com$' "$KINETIX_HOME/.env"
          test "$(grep '^KINETIX_SECRET_KEY=' "$KINETIX_HOME/.env" | cut -d= -f2 | wc -c)" -ge 64
      - name: Nothing is published on the host
        run: |
          docker ps --format '{{.Names}} {{.Ports}}'
          if docker ps --format '{{.Ports}}' | grep -q -- '->'; then echo "a port is published"; exit 1; fi
      - name: API runs in production mode behind the edge
        run: |
          cd "$KINETIX_HOME"
          C="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tunnel.yml"
          $C exec -T edge wget -qO- http://127.0.0.1/api/health | grep -q '"ok"'
          # Production doesn't publish the API schema.
          if $C exec -T edge wget -qO- http://127.0.0.1/api/openapi.json 2>/dev/null; then exit 1; fi
          $C exec -T edge wget -qO- http://127.0.0.1/login | grep -q '<title>Sign in'
      - name: A rerun keeps settings
        run: |
          before=$(sha256sum "$KINETIX_HOME/.env")
          sh scripts/quickstart.sh < /dev/null
          test "$before" = "$(sha256sum "$KINETIX_HOME/.env")"
      - name: Logs
        if: failure()
        run: cd "$KINETIX_HOME" && docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tunnel.yml logs --no-color --tail 200
