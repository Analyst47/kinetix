rules:
  - id: kinetix-js-sqli-raw-query
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A raw SQL string is built by interpolating a value and passed to $DB.query().
      If the value is user-controlled this is SQL injection. Use bind parameters
      (replacements / $1 placeholders) instead of string building.
    metadata:
      title: Potential SQL injection in raw query
      kinetix_severity: critical
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.query("..." + $X + ..., ...)
      - pattern: $DB.query($A + $X, ...)

  - id: kinetix-js-path-traversal-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A file path is built from request data and used to read or send a file.
      Normalize the path and verify it stays inside the intended directory.
    metadata:
      title: Potential path traversal from request data
      kinetix_severity: high
      kinetix_confidence: firm
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.params
          - pattern: $REQ.query
          - pattern: $REQ.body
          # Express handlers that destructure the request: ({ params }, res) => ...
          - patterns:
              - pattern-either:
                  - pattern-inside: "({ params }, $RES) => { ... }"
                  - pattern-inside: "({ params }: $T, $RES: $R) => { ... }"
              - pattern: params
          - patterns:
              - pattern-either:
                  - pattern-inside: "({ query }, $RES) => { ... }"
                  - pattern-inside: "({ query }: $T, $RES: $R) => { ... }"
              - pattern: query
    pattern-sinks:
      - pattern-either:
          - pattern: $RES.sendFile(...)
          - pattern: $RES.download(...)
          - pattern: fs.readFile(...)
          - pattern: fs.readFileSync(...)
          - pattern: fs.createReadStream(...)
    pattern-sanitizers:
      - pattern: path.basename(...)

  - id: kinetix-js-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data reaches a shell command. Use execFile/spawn with an argument array
      and validate the input against an allowlist.
    metadata:
      title: Potential command injection from request data
      kinetix_severity: critical
      kinetix_confidence: firm
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.params
          - pattern: $REQ.query
          - pattern: $REQ.body
    pattern-sinks:
      - pattern-either:
          - pattern: child_process.exec(...)
          - pattern: child_process.execSync(...)
          - pattern: exec(...)
          - pattern: execSync(...)

  - id: kinetix-js-code-injection-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic code evaluation of a non-literal value. Remove eval or parse the data instead.
    metadata:
      title: Dynamic code evaluation
      kinetix_severity: high
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"]
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
          - pattern: vm.runInContext($X, ...)
          - pattern: vm.runInNewContext($X, ...)
      - pattern-not: eval("...")

  - id: kinetix-angular-bypass-sanitizer
    languages: [typescript]
    severity: WARNING
    message: >-
      $SAN.$METHOD() disables Angular's built-in sanitization. If the value can contain
      user input this enables cross-site scripting.
    metadata:
      title: Angular sanitizer bypassed
      kinetix_severity: medium
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation"]
    patterns:
      - pattern: $SAN.$METHOD($X)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^bypassSecurityTrust(Html|Script|Style|Url|ResourceUrl)$
      - pattern-not: $SAN.$METHOD("...")

  - id: kinetix-js-weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      $ALG is not suitable for passwords or integrity checks. Use a password hash
      (argon2id, bcrypt) or SHA-256 for integrity.
    metadata:
      title: Weak hash algorithm
      kinetix_severity: low
      cwe: ["CWE-328: Use of Weak Hash"]
    patterns:
      - pattern: crypto.createHash("$ALG")
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^(md5|sha1|md4)$

  - id: kinetix-js-open-redirect
    languages: [javascript, typescript]
    severity: WARNING
    message: Request data controls a redirect target. Redirect only to an allowlist of exact URLs.
    metadata:
      title: Potential open redirect
      kinetix_severity: medium
      kinetix_confidence: firm
      cwe: ["CWE-601: URL Redirection to Untrusted Site"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
    pattern-sinks:
      - pattern: $RES.redirect(...)

  - id: kinetix-js-ssrf-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data controls the URL of an outbound HTTP request. An attacker can reach
      internal services (SSRF). Validate against an allowlist of hosts.
    metadata:
      title: Potential server-side request forgery (SSRF)
      kinetix_severity: high
      kinetix_confidence: firm
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
          - pattern: $REQ.headers
    pattern-sinks:
      - pattern-either:
          - pattern: axios.$M(...)
          - pattern: fetch(...)
          - pattern: http.get(...)
          - pattern: http.request(...)
          - pattern: https.get(...)
          - pattern: https.request(...)
          - pattern: got(...)
          - pattern: request(...)
          - pattern: superagent.$M(...)

  - id: kinetix-js-ssti-template
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data is compiled as a template. Template injection can lead to code
      execution. Render data into a precompiled template instead of compiling input.
    metadata:
      title: Potential server-side template injection
      kinetix_severity: critical
      kinetix_confidence: firm
      cwe: ["CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
    pattern-sinks:
      - pattern-either:
          - pattern: $H.compile(...)
          - pattern: ejs.render(...)
          - pattern: pug.compile(...)
          - pattern: pug.render(...)
          - pattern: _.template(...)

  - id: kinetix-js-reflected-xss
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data is written into an HTTP response body. If the response is HTML this is
      reflected cross-site scripting. Encode output for its context.
    metadata:
      title: Potential reflected cross-site scripting
      kinetix_severity: high
      kinetix_confidence: firm
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
    pattern-sinks:
      - pattern-either:
          - pattern: $RES.send(...)
          - pattern: $RES.write(...)
          - pattern: $RES.end(...)
    pattern-sanitizers:
      - pattern: JSON.stringify(...)

  - id: kinetix-js-nosql-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data flows into a database query object. A crafted object ($gt, $where, $ne)
      can bypass the filter. Cast inputs to their expected type before querying.
    metadata:
      title: Potential NoSQL injection
      kinetix_severity: high
      kinetix_confidence: firm
      cwe: ["CWE-943: Improper Neutralization of Data within Query Logic"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
    pattern-sinks:
      - pattern-either:
          - pattern: $M.find(...)
          - pattern: $M.findOne(...)
          - pattern: $M.findOneAndUpdate(...)
          - pattern: $M.updateMany(...)
          - pattern: $M.deleteMany(...)

  - id: kinetix-js-prototype-pollution
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data is deep-merged into an object. A __proto__ key can pollute the object
      prototype. Use a merge that drops prototype keys, or validate keys.
    metadata:
      title: Potential prototype pollution
      kinetix_severity: high
      kinetix_confidence: firm
      cwe: ["CWE-1321: Improperly Controlled Modification of Object Prototype Attributes"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
    pattern-sinks:
      - pattern-either:
          - pattern: _.merge(...)
          - pattern: _.mergeWith(...)
          - pattern: _.defaultsDeep(...)
          - pattern: _.set(...)
          - pattern: merge(...)

  - id: kinetix-js-redos-request
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A regular expression is built from request data. A crafted pattern can hang the
      event loop (ReDoS). Never compile user input as a regular expression.
    metadata:
      title: Regular expression built from request data (ReDoS)
      kinetix_severity: medium
      kinetix_confidence: firm
      cwe: ["CWE-1333: Inefficient Regular Expression Complexity"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
    pattern-sinks:
      - pattern-either:
          - pattern: new RegExp(...)
          - pattern: RegExp(...)

  - id: kinetix-js-jwt-no-algorithms
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      jwt.verify() is called without pinning algorithms. A token with alg:none or a
      swapped algorithm may be accepted. Pass an explicit algorithms list.
    metadata:
      title: JWT verified without pinned algorithms
      kinetix_severity: high
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
    patterns:
      - pattern: $JWT.verify($T, $S)
      - pattern-not: $JWT.verify("...", ...)

  - id: kinetix-js-cors-wildcard-credentials
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      CORS allows any origin together with credentials. This exposes authenticated
      responses to any site. Reflect only an allowlist of origins.
    metadata:
      title: Insecure CORS (any origin with credentials)
      kinetix_severity: medium
      cwe: ["CWE-942: Permissive Cross-domain Policy with Untrusted Domains"]
    patterns:
      - pattern: 'cors({..., origin: "*", ..., credentials: true, ...})'

  - id: kinetix-js-insecure-randomness
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Math.random() is not cryptographically secure. Using it for a token, key or secret
      is predictable. Use crypto.randomBytes / crypto.randomUUID.
    metadata:
      title: Insecure randomness used for a secret
      kinetix_severity: medium
      cwe: ["CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"]
    patterns:
      - pattern: $V = Math.random()
      - metavariable-regex:
          metavariable: $V
          regex: (?i).*(token|secret|otp|password|passwd|key|nonce|salt|session).*
