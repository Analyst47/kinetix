# Local development stack. `docker compose up --build`, then open http://localhost:3000
name: kinetix

x-api-env: &api-env
  # The API and worker connect as kinetix_app, which row-level security applies to.
  # Migrations connect as the owner. Change both passwords outside local development.
  KINETIX_DATABASE_URL: postgresql+psycopg://kinetix_app:${KINETIX_DB_APP_PASSWORD:-kinetix_app}@postgres:5432/kinetix
  KINETIX_MIGRATION_DATABASE_URL: postgresql+psycopg://kinetix:${POSTGRES_PASSWORD:-kinetix}@postgres:5432/kinetix
  KINETIX_REDIS_URL: redis://redis:6379/0
  KINETIX_STORAGE_DIR: /data
  KINETIX_SCAN_MODE: celery
  KINETIX_CORS_ORIGINS: '["http://localhost:3000"]'
  # AI assistance: none | anthropic | openai_compatible | mock. See README.
  KINETIX_AI_PROVIDER: ${KINETIX_AI_PROVIDER:-none}
  KINETIX_AI_API_KEY: ${KINETIX_AI_API_KEY:-}
  KINETIX_AI_MODEL: ${KINETIX_AI_MODEL:-}
  KINETIX_AI_BASE_URL: ${KINETIX_AI_BASE_URL:-}
  KINETIX_AI_GEMINI_TIER: ${KINETIX_AI_GEMINI_TIER:-free}
  # Email: console (printed to logs) | resend. See README.
  KINETIX_EMAIL_BACKEND: ${KINETIX_EMAIL_BACKEND:-console}
  KINETIX_RESEND_API_KEY: ${KINETIX_RESEND_API_KEY:-}
  KINETIX_EMAIL_FROM: ${KINETIX_EMAIL_FROM:-Kinetix <no-reply@localhost>}
  KINETIX_DEMO_ACCOUNT_EMAIL: ${KINETIX_DEMO_ACCOUNT_EMAIL:-demo@kinetix.dev}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kinetix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetix}
      POSTGRES_DB: kinetix
      KINETIX_DB_APP_PASSWORD: ${KINETIX_DB_APP_PASSWORD:-kinetix_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetix"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    build: { context: ./api, target: api }
    environment: *api-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    volumes: [storage:/data]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ./api, target: api }
    environment: *api-env
    volumes: [storage:/data]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ./api, target: worker }
    environment:
      <<: *api-env
      HOME: /tmp
    volumes: [storage:/data]
    # Analyzers read untrusted code: no inbound ports, a read-only root filesystem and capped resources.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 512
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ./web }
    environment:
      KINETIX_API_URL: http://api:8000
      KINETIX_DEMO: "1"
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
