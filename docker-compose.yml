# Full stack. `docker compose up --build`, then open http://localhost:3000
# Production: see docs/DEPLOY.md (adds docker-compose.prod.yml on top of this file).
#
# Only the edge (Caddy) is published. The API and web app are reachable only inside the
# Compose network, so nobody can reach the API directly or spoof the client address.
name: kinetix

x-api-env: &api-env
  KINETIX_ENV: ${KINETIX_ENV:-development}
  KINETIX_SECRET_KEY: ${KINETIX_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
  KINETIX_APP_URL: ${KINETIX_APP_URL:-http://localhost:3000}
  KINETIX_CORS_ORIGINS: '["${KINETIX_APP_URL:-http://localhost:3000}"]'
  KINETIX_DEMO: ${KINETIX_DEMO:-1}
  # The API and worker connect as kinetix_app, which row-level security applies to.
  # Migrations connect as the owner. Change both passwords outside local development.
  KINETIX_DATABASE_URL: postgresql+psycopg://kinetix_app:${KINETIX_DB_APP_PASSWORD:-kinetix_app}@postgres:5432/kinetix
  KINETIX_MIGRATION_DATABASE_URL: postgresql+psycopg://kinetix:${POSTGRES_PASSWORD:-kinetix}@postgres:5432/kinetix
  KINETIX_REDIS_URL: redis://redis:6379/0
  # Rate limits are shared across API processes, and the client IP comes from the edge only.
  KINETIX_RATE_LIMIT_BACKEND: redis
  KINETIX_TRUSTED_PROXIES: '["172.28.0.10/32"]'
  KINETIX_STORAGE_DIR: /data
  KINETIX_SCAN_MODE: celery
  # AI assistance: none | gemini | anthropic | openai_compatible | mock. See README.
  KINETIX_AI_PROVIDER: ${KINETIX_AI_PROVIDER:-none}
  KINETIX_AI_API_KEY: ${KINETIX_AI_API_KEY:-}
  KINETIX_AI_MODEL: ${KINETIX_AI_MODEL:-}
  KINETIX_AI_BASE_URL: ${KINETIX_AI_BASE_URL:-}
  KINETIX_AI_GEMINI_TIER: ${KINETIX_AI_GEMINI_TIER:-free}
  # Email: console (printed to logs) | resend. See README.
  KINETIX_EMAIL_BACKEND: ${KINETIX_EMAIL_BACKEND:-console}
  KINETIX_RESEND_API_KEY: ${KINETIX_RESEND_API_KEY:-}
  KINETIX_EMAIL_FROM: ${KINETIX_EMAIL_FROM:-Kinetix <no-reply@localhost>}
  KINETIX_DEMO_ACCOUNT_EMAIL: ${KINETIX_DEMO_ACCOUNT_EMAIL:-demo@kinetix.dev}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kinetix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetix}
      POSTGRES_DB: kinetix
      KINETIX_DB_APP_PASSWORD: ${KINETIX_DB_APP_PASSWORD:-kinetix_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetix"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    build: { context: ./api, target: api }
    environment: *api-env
    # Migrate as the owner, then load the demo workspace only when the demo is on.
    command: ["sh", "-c", "alembic upgrade head && if [ \"$$KINETIX_DEMO\" = 1 ]; then python -m app.seed; fi"]
    volumes: [storage:/data]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ./api, target: api }
    environment: *api-env
    volumes: [storage:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ./api, target: worker }
    environment:
      <<: *api-env
      HOME: /tmp
    volumes: [storage:/data]
    # Analyzers read untrusted code: no inbound ports, a read-only root filesystem and capped resources.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 512
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ./web }
    environment:
      KINETIX_API_URL: http://api:8000
      KINETIX_DEMO: ${KINETIX_DEMO:-1}
    depends_on:
      api: { condition: service_healthy }

  edge:
    image: caddy:2.10-alpine
    environment:
      # Your domain in production for automatic HTTPS (see docker-compose.prod.yml).
      KINETIX_SITE_ADDRESS: ${KINETIX_SITE_ADDRESS:-:80}
      # none (directly on the internet) | cloudflared (behind Cloudflare Tunnel)
      KINETIX_EDGE_TRUST: ${KINETIX_EDGE_TRUST:-none}
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - caddy-data:/data
    ports: ["3000:80"]
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  # Optional: `docker compose --profile tunnel up` publishes the edge through Cloudflare
  # Tunnel, so the machine needs no open ports (works on a home computer). See docs/DEPLOY.md.
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      default:
        ipv4_address: 172.28.0.11
    depends_on: [edge]

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  storage:
  caddy-data:
